<head>

<style>
:root{
  --bg:#EEF2EC; --card:#FFFFFF; --ink:#17231C; --muted:#4F5F55; --line:#CBD6CC;
  --basil:#1F6B45; --basil-d:#154D32; --tomato:#B3261E; --ok:#1F6B45; --okbg:#DDF0E4; --badbg:#F8DEDB; --sun:#F1D58A;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111A15; --card:#1B2820; --ink:#EDF3EE; --muted:#A9B9AF; --line:#34483B;
    --basil:#5DBB8A; --basil-d:#8AD6AF; --tomato:#FF8A80; --ok:#7FD6A3; --okbg:#1F3D2B; --badbg:#4A2420; --sun:#6B5A25; }
}
*{box-sizing:border-box}
html{font-size:19px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
main{max-width:680px;margin:0 auto;padding:1rem 1rem 3rem}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5rem}
h1{font-size:1.9rem} h2{font-size:1.45rem;margin-top:1.6rem} h3{font-size:1.15rem}
p{margin:.5rem 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.8rem}
.btn{font:inherit;font-weight:600;min-height:3rem;padding:.6rem 1.1rem;border-radius:.8rem;border:2px solid var(--basil);background:var(--basil);color:#fff;cursor:pointer}
@media (prefers-color-scheme: dark){.btn{color:#0E1A13}}
.btn.alt{background:transparent;color:var(--basil)}
.btn.small{min-height:2.4rem;padding:.3rem .8rem;font-size:.9rem}
.btn:focus-visible,.row:focus-visible,.opt:focus-visible,.vocab:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.hero{background:var(--basil);color:#fff;border-radius:1rem;padding:1.2rem 1.1rem;margin-bottom:1rem}
@media (prefers-color-scheme: dark){.hero{color:#0E1A13}}
.hero h1{margin:0 0 .2rem}
.hero p{margin:0;opacity:.95}
.bar{height:.6rem;background:rgba(255,255,255,.3);border-radius:1rem;margin-top:.8rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:1rem}
.row{display:flex;gap:.9rem;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:1rem;padding:.9rem;margin-bottom:.7rem;cursor:pointer}
.row[disabled]{opacity:.55;cursor:not-allowed}
.num{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--bg);border:2px solid var(--basil);display:grid;place-items:center;font-weight:700;color:var(--basil)}
.row.done .num{background:var(--basil);color:#fff}
@media (prefers-color-scheme: dark){.row.done .num{color:#0E1A13}}
.row b{display:block;font-size:1.05rem}
.row small{color:var(--muted);font-size:.85rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:1rem;padding:1rem;margin:.7rem 0}
.tip{border-left:6px solid var(--sun);background:var(--card);border-radius:.5rem;padding:.7rem .9rem;margin:.6rem 0}
.vocab{display:flex;justify-content:space-between;align-items:center;gap:.6rem;width:100%;font:inherit;color:inherit;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:.9rem;padding:.7rem .9rem;margin-bottom:.5rem;cursor:pointer}
.vocab .it{font-weight:700;font-size:1.1rem;color:var(--basil)}
.vocab .es{display:block}
.vocab .pr{display:block;color:var(--muted);font-size:.88rem}
.spk{flex:none;font-size:1.4rem}
.q{font-size:1.2rem;font-weight:600;margin:.6rem 0 1rem}
.opt{display:block;width:100%;font:inherit;color:inherit;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:.9rem;padding:.85rem 1rem;margin-bottom:.6rem;cursor:pointer;min-height:3rem}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--tomato)}
.fb{border-radius:.8rem;padding:.8rem 1rem;margin:.8rem 0}
.fb.ok{background:var(--okbg)} .fb.bad{background:var(--badbg)}
.prog{color:var(--muted);font-size:.9rem}
.big{font-size:3rem;font-family:Georgia,serif;font-weight:700;margin:.3rem 0}
.tools{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1.2rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:.7rem;font-size:.9rem;max-width:90%}
.in{font:inherit;width:100%;min-height:3rem;padding:.6rem .8rem;border-radius:.8rem;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:.6rem}
.in:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
.lbl{display:block;font-weight:600;margin:.4rem 0 .2rem}
.msg{min-height:1.5rem;margin:.6rem 0;font-weight:600}
.stack .btn{width:100%;margin-bottom:.6rem}
@media (prefers-reduced-motion: no-preference){.bar i{transition:width .4s}}
</style>
</head>

/* ====================== ESTADO Y PROGRESO ====================== */
const PASS = 5; // aciertos necesarios (de 6) para desbloquear la siguiente lección
const KEY = "italiano-a1-progreso";
const KEYFS = "italiano-a1-letra";
let progress = {};
try { progress = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { progress = {}; }
function save(skipPush) { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {} if (!skipPush) fbPush(); }
let fs = 19;
try { fs = parseInt(localStorage.getItem(KEYFS), 10) || 19; } catch (e) {}
function applyFs() { document.documentElement.style.fontSize = fs + "px"; try { localStorage.setItem(KEYFS, String(fs)); } catch (e) {} }
applyFs();

const app = document.getElementById("app");
let st = { view: "home", i: 0, qi: 0, score: 0, answered: null, opts: [] };

function unlocked(i) { return i === 0 || progress[i - 1] >= PASS; }
function doneCount() { return LESSONS.filter((_, i) => progress[i] >= PASS).length; }
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

/* ====================== AUDIO ====================== */
function say(text) {
  try {
    if (!("speechSynthesis" in window)) { toast("Este móvil no tiene voz para reproducir audio."); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\s*\/\s*/g, ", "));
    u.lang = "it-IT"; u.rate = 0.85;
    const v = speechSynthesis.getVoices().find(x => x.lang && x.lang.toLowerCase().replace("_", "-").startsWith("it"));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
if ("speechSynthesis" in window) { try { speechSynthesis.getVoices(); } catch (e) {} }
let toastT;
function toast(m) {
  const old = document.querySelector(".toast"); if (old) old.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3000);
}

/* ====================== VISTAS ====================== */
function go(view, extra) { Object.assign(st, { view }, extra || {}); render(); window.scrollTo(0, 0); }

function render() {
  if (st.view === "home") return home();
  if (st.view === "lesson") return lesson();
  if (st.view === "quiz") return quiz();
  if (st.view === "result") return result();
  if (st.view === "sync") return syncView();
}

function home() {
  const n = doneCount(), pct = Math.round(n / LESSONS.length * 100);
  let h = `<div class="hero"><h1>Italiano Básico A1</h1><p>Ocho lecciones desde cero, con audio y ejercicios.</p>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <p style="margin-top:.5rem">${n} de ${LESSONS.length} lecciones superadas</p></div>`;
  LESSONS.forEach((L, i) => {
    const ok = progress[i] >= PASS, open = unlocked(i);
    h += `<button class="row ${ok ? "done" : ""}" data-i="${i}" ${open ? "" : "disabled"}>
      <span class="num">${ok ? "✓" : open ? i + 1 : "🔒"}</span>
      <span><b>${esc(L.title)}</b><small>${esc(L.sub)}${progress[i] != null ? " · mejor resultado: " + progress[i] + "/6" : ""}</small></span></button>`;
  });
  h += `<p class="prog">Para pasar a la siguiente lección necesitas ${PASS} aciertos de 6. Puedes repetir los ejercicios las veces que quieras.</p>
    <div class="tools"><button class="btn alt small" id="fm">A−</button><button class="btn alt small" id="fp">A+</button>
    <button class="btn alt small" id="sy">☁ ${FB.user ? "Sincronizado" : "Sincronizar"}</button>
    <button class="btn alt small" id="rs">Borrar progreso</button></div>`;
  app.innerHTML = h;
  app.querySelectorAll(".row").forEach(b => b.onclick = () => go("lesson", { i: +b.dataset.i }));
  document.getElementById("fm").onclick = () => { fs = Math.max(16, fs - 2); applyFs(); };
  document.getElementById("fp").onclick = () => { fs = Math.min(28, fs + 2); applyFs(); };
  document.getElementById("rs").onclick = () => { if (confirm("¿Borrar todo el progreso?")) { progress = {}; save(); render(); } };
  document.getElementById("sy").onclick = () => { go("sync"); fbInit().then(() => { if (st.view === "sync") render(); }); };
}

function lesson() {
  const L = LESSONS[st.i];
  let h = `<div class="top"><button class="btn alt small" id="back">‹ Lecciones</button><span class="prog">Lección ${st.i + 1} de ${LESSONS.length}</span></div>
    <h1>${esc(L.title)}</h1>`;
  L.intro.forEach(p => h += `<p>${p}</p>`);
  h += `<h2>Vocabulario</h2><p class="prog">Toca cada fila para escuchar la pronunciación.</p>`;
  L.vocab.forEach((v, k) => {
    h += `<button class="vocab" data-k="${k}"><span><span class="it">${esc(v[0])}</span><span class="es">${esc(v[1])}</span><span class="pr">se lee: ${esc(v[2])}</span></span><span class="spk" aria-hidden="true">🔊</span></button>`;
  });
  h += `<h2>Pronunciación</h2>`;
  L.tips.forEach(t => h += `<div class="tip">${t}</div>`);
  h += `<p style="margin-top:1.5rem"><button class="btn" id="go" style="width:100%">Hacer los ejercicios</button></p>`;
  app.innerHTML = h;
  document.getElementById("back").onclick = () => go("home");
  document.getElementById("go").onclick = () => go("quiz", { qi: 0, score: 0, answered: null, opts: shuffle(L.quiz[0].o) });
  app.querySelectorAll(".vocab").forEach(b => b.onclick = () => say(L.vocab[+b.dataset.k][0]));
}

function quiz() {
  const L = LESSONS[st.i], Q = L.quiz[st.qi];
  let h = `<div class="top"><button class="btn alt small" id="back">‹ Salir</button><span class="prog">Pregunta ${st.qi + 1} de ${L.quiz.length}</span></div>
    <h2 style="margin-top:.5rem">${esc(L.title)}</h2><div class="q">${esc(Q.q)}</div>`;
  st.opts.forEach((o, k) => {
    let cls = "";
    if (st.answered !== null) { if (o === Q.a) cls = "ok"; else if (o === st.answered) cls = "bad"; }
    h += `<button class="opt ${cls}" data-k="${k}" ${st.answered !== null ? "disabled" : ""}>${esc(o)}</button>`;
  });
  if (st.answered !== null) {
    const good = st.answered === Q.a;
    h += `<div class="fb ${good ? "ok" : "bad"}" role="status"><b>${good ? "✓ Correcto" : "✗ No es esa. La correcta es: " + esc(Q.a)}</b><br>${esc(Q.w)}</div>
      <button class="btn" id="next" style="width:100%">${st.qi + 1 < L.quiz.length ? "Siguiente" : "Ver resultado"}</button>`;
  }
  app.innerHTML = h;
  document.getElementById("back").onclick = () => go("lesson");
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    st.answered = st.opts[+b.dataset.k];
    if (st.answered === Q.a) st.score++;
    render();
  });
  const nx = document.getElementById("next");
  if (nx) nx.onclick = () => {
    if (st.qi + 1 < L.quiz.length) { st.qi++; st.answered = null; st.opts = shuffle(L.quiz[st.qi].o); render(); window.scrollTo(0, 0); }
    else {
      if (progress[st.i] == null || st.score > progress[st.i]) progress[st.i] = st.score;
      save(); go("result");
    }
  };
}

function result() {
  const L = LESSONS[st.i], n = L.quiz.length, pass = st.score >= PASS, last = st.i === LESSONS.length - 1;
  let h = `<div class="top"><span class="prog">${esc(L.title)}</span></div>
    <div class="card" style="text-align:center"><div class="big">${st.score} / ${n}</div>
    <p><b>${pass ? (last ? "¡Has terminado el curso A1! Enhorabuena." : "¡Muy bien! Lección superada.") : "Casi. Repasa la lección y vuelve a intentarlo."}</b></p>
    <p class="prog">${pass ? "" : `Necesitas ${PASS} aciertos para pasar a la siguiente.`}</p></div>`;
  if (pass && !last) h += `<button class="btn" id="n" style="width:100%;margin-bottom:.6rem">Siguiente lección</button>`;
  h += `<button class="btn alt" id="r" style="width:100%;margin-bottom:.6rem">${pass ? "Repetir ejercicios" : "Repasar la lección"}</button>
    <button class="btn alt" id="h" style="width:100%">Todas las lecciones</button>`;
  app.innerHTML = h;
  const nb = document.getElementById("n"); if (nb) nb.onclick = () => go("lesson", { i: st.i + 1 });
  document.getElementById("r").onclick = () => pass ? go("quiz", { qi: 0, score: 0, answered: null, opts: shuffle(L.quiz[0].o) }) : go("lesson");
  document.getElementById("h").onclick = () => go("home");
}

/* ====================== SINCRONIZACIÓN (Firebase) ====================== */
const FB = { p: null, ready: false, error: false, user: null, auth: null, db: null, au: null, fs: null };
function fbConfigured() {
  const c = window.FIREBASE_CONFIG;
  return !!(c && c.apiKey && String(c.apiKey).indexOf("PEGA") !== 0 && c.projectId && String(c.projectId).indexOf("PEGA") !== 0);
}
function fbInit() {
  if (!fbConfigured()) return Promise.resolve();
  if (FB.p) return FB.p;
  FB.p = (async () => {
    try {
      const base = "https://www.gstatic.com/firebasejs/10.14.1/";
      const [a, au, fsm] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
      const app = a.initializeApp(window.FIREBASE_CONFIG);
      FB.au = au; FB.fs = fsm; FB.auth = au.getAuth(app); FB.db = fsm.getFirestore(app);
      FB.ready = true; FB.error = false;
      au.onAuthStateChanged(FB.auth, async u => {
        FB.user = u;
        if (u) await fbPull();
        if (st.view === "home" || st.view === "sync") render();
      });
    } catch (e) { FB.error = true; FB.p = null; }
  })();
  return FB.p;
}
async function fbPull() {
  try {
    const ref = FB.fs.doc(FB.db, "usuarios", FB.user.uid);
    const snap = await FB.fs.getDoc(ref);
    const remote = (snap.exists() && snap.data().progreso) || {};
    let changed = false;
    for (const k in remote) { if (!(progress[k] >= remote[k])) { progress[k] = remote[k]; changed = true; } }
    if (changed) save(true);
    await fbPush();
  } catch (e) {}
}
async function fbPush() {
  if (!FB.ready || !FB.user) return;
  try { await FB.fs.setDoc(FB.fs.doc(FB.db, "usuarios", FB.user.uid), { progreso: progress, actualizado: FB.fs.serverTimestamp() }); } catch (e) {}
}
function msg(t) { const m = document.getElementById("msg"); if (m) m.textContent = t; }
function errEs(e) {
  const c = (e && e.code) || "";
  if (c === "auth/invalid-credential" || c === "auth/wrong-password" || c === "auth/user-not-found") return "Correo o contraseña incorrectos.";
  if (c === "auth/email-already-in-use") return "Ya existe una cuenta con ese correo. Pulsa Entrar.";
  if (c === "auth/weak-password") return "La contraseña debe tener al menos 6 caracteres.";
  if (c === "auth/invalid-email") return "El correo no es válido.";
  if (c === "auth/missing-password") return "Escribe la contraseña.";
  if (c === "auth/network-request-failed") return "Sin conexión. Inténtalo cuando tengas internet.";
  if (c === "auth/too-many-requests") return "Demasiados intentos. Espera un rato y vuelve a probar.";
  return "No se pudo completar. Revisa los datos e inténtalo de nuevo.";
}
function syncView() {
  let h = `<div class="top"><button class="btn alt small" id="back">‹ Lecciones</button></div><h1>Sincronizar</h1>`;
  if (!fbConfigured()) {
    h += `<div class="card"><p>La sincronización aún no está activada. Falta pegar los datos de Firebase en el archivo <b>firebase-config.js</b>.</p></div>`;
  } else if (FB.error) {
    h += `<div class="card"><p>No se pudo conectar con el servicio. Comprueba que tienes internet.</p></div><button class="btn" id="retry" style="width:100%">Reintentar</button>`;
  } else if (!FB.ready) {
    h += `<div class="card"><p>Conectando…</p></div>`;
  } else if (FB.user) {
    h += `<div class="card"><p>Sincronizado con <b>${esc(FB.user.email)}</b>.</p>
      <p class="prog">Tu progreso se guarda en la nube y aparece en cualquier dispositivo donde entres con esta cuenta.</p></div>
      <div class="msg" id="msg" role="status"></div>
      <div class="stack"><button class="btn" id="now">Sincronizar ahora</button><button class="btn alt" id="out">Cerrar sesión</button></div>`;
  } else {
    h += `<p>Entra con tu correo para guardar tu progreso en la nube y verlo en todos tus dispositivos. Si es la primera vez, pulsa <b>Crear cuenta</b>.</p>
      <label class="lbl" for="em">Correo electrónico</label>
      <input class="in" id="em" type="email" autocomplete="email" inputmode="email">
      <label class="lbl" for="pw">Contraseña (mínimo 6 caracteres)</label>
      <input class="in" id="pw" type="password" autocomplete="current-password">
      <div class="msg" id="msg" role="status"></div>
      <div class="stack"><button class="btn" id="in">Entrar</button><button class="btn alt" id="up">Crear cuenta</button><button class="btn alt small" id="fg">He olvidado la contraseña</button></div>`;
  }
  app.innerHTML = h;
  document.getElementById("back").onclick = () => go("home");
  const $ = id => document.getElementById(id);
  const run = async fn => { msg("Un momento…"); try { await fn(); } catch (e) { msg(errEs(e)); } };
  if ($("retry")) $("retry").onclick = () => { FB.error = false; fbInit().then(() => { if (st.view === "sync") render(); }); };
  if ($("now")) $("now").onclick = () => run(async () => { await fbPull(); msg("Sincronizado ✓"); });
  if ($("out")) $("out").onclick = () => run(() => FB.au.signOut(FB.auth));
  if ($("in")) {
    const E = () => $("em").value.trim(), P = () => $("pw").value;
    $("in").onclick = () => run(() => FB.au.signInWithEmailAndPassword(FB.auth, E(), P()));
    $("up").onclick = () => run(() => FB.au.createUserWithEmailAndPassword(FB.auth, E(), P()));
    $("fg").onclick = () => run(async () => {
      if (!E()) { msg("Escribe tu correo arriba y vuelve a pulsar."); return; }
      await FB.au.sendPasswordResetEmail(FB.auth, E());
      msg("Te hemos enviado un correo para cambiar la contraseña.");
    });
  }
}

render();
fbInit();
window.addEventListener("online", () => { if (!FB.ready) fbInit(); });

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
